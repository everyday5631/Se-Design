# Veroeffentlicht die Dokumentationsseite (site/) auf GitHub Pages.
# Bewusst NUR manuell ausloesbar (Actions -> "Dokumentationsseite" -> Run workflow):
# Die Seite ist vorerst nicht oeffentlich. Pages ist im Repo-Setting zuerst auf
# "GitHub Actions" zu stellen. Hinweis: Eine Pages-Seite ist oeffentlich erreichbar,
# auch wenn das Repository privat ist (ausser bei GitHub Enterprise Cloud).
name: Dokumentationsseite

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
